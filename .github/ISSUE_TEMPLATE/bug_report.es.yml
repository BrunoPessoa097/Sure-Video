name: "Informar de un error"
description: "Informa de un error o comportamiento inesperado en Sure Video."
title: "[BUG] "
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Describe el problema que encontraste.
      placeholder: Explica qué ocurrió.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Indica los pasos necesarios para reproducir el problema.
      placeholder: |
        1. Abre...
        2. Haz clic en...
        3. Observa el error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debería haber ocurrido?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Indica tu sistema operativo y cualquier otra información relevante.
      placeholder: P. ej., Linux, Windows, versión de Sure Video.
    validations:
      required: false
