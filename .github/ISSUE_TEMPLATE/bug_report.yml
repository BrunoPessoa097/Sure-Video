name: "Relatar um problema"
description: "Informe um erro ou comportamento inesperado no Sure Video."
title: "[BUG] "
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição do problema
      description: Descreva o problema encontrado.
      placeholder: Explique o que aconteceu.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Informe os passos necessários para reproduzir o problema.
      placeholder: |
        1. Acesse...
        2. Clique em...
        3. Observe o erro.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Informe seu sistema operacional e outras informações relevantes.
      placeholder: Ex.: Linux, Windows, versão do Sure Video.
    validations:
      required: false